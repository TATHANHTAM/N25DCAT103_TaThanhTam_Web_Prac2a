name: lab2a-microservices-shop

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: lab2a_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: products_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-auth-db.sql:ro
    ports:
      - "5432:5432"
    networks: [microservices-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: lab2a_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: orders_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks: [microservices-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "admin", "--password", "secret", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lab2a_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [microservices-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-service:
    build: ./product-service
    container_name: lab2a_product_service
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql://admin:secret@postgres:5432/products_db
      REDIS_URL: redis://redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [microservices-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: lab2a_auth_service
    environment:
      NODE_ENV: production
      PORT: 3003
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://admin:secret@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-lab2a-access-secret-change-before-production-123456}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-lab2a-refresh-secret-change-before-production-123456}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [microservices-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build: ./order-service
    container_name: lab2a_order_service
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_NAME: order-service
      MONGODB_URI: mongodb://admin:secret@mongo:27017/orders_db?authSource=admin
      PRODUCT_SERVICE_URL: http://product-service:3001
      VALIDATE_PRODUCTS: "true"
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks: [microservices-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: lab2a_api_gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      AUTH_SERVICE_URL: http://auth-service:3003
      JWT_SECRET: ${JWT_SECRET:-lab2a-access-secret-change-before-production-123456}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks: [microservices-net]

